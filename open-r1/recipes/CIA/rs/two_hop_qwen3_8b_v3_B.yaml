# CIA Rejection Sampling — TwoHopFact (paper §5)
# Stage: RS-B = SFT on faith-only filtered rollouts (B_INT==B_CoT, accuracy NOT required).
#
# Pipeline:
#   1. python scripts/cia/generate_rollouts.py --task two_hop --model_path ... \
#         --dataset_path ${SCRATCH}/open-r1/datasets/TwoHopFact_cia_<model>_linear_probe \
#         --output ${SCRATCH}/open-r1/rollouts/two_hop_<model>.jsonl \
#         --subsample 1800   # parity with Hint / Mult train size
#   2. python scripts/cia/build_rs_dataset.py \
#         --rollouts ${SCRATCH}/open-r1/rollouts/two_hop_<model>.jsonl \
#         --out_dir  ${SCRATCH}/open-r1/datasets/TwoHopFact_rs_<model>
#   3. accelerate launch src/open_r1/sft.py --config recipes/CIA/rs/two_hop.yaml

model_name_or_path: ${SCRATCH}/transformers/Qwen3-8B
model_revision: main
torch_dtype: bfloat16
attn_implementation: sdpa

dataset_name: ${SCRATCH}/open-r1/datasets/TwoHopFact_rs_B_v3_qwen3_8b
dataset_config: default
dataset_train_split: train
dataset_test_split: validation

# SFT-specific
max_seq_length: 2048
packing: false
dataset_text_field: text

# Hparams (start matching GRPO's appendix E grid; adjust on val CIA)
learning_rate: 1.0e-06
lr_scheduler_type: cosine
warmup_ratio: 0.1
num_train_epochs: 2
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
bf16: true
optim: adamw_bnb_8bit

log_level: info
logging_first_step: true
logging_steps: 10
logging_strategy: steps
save_strategy: steps
save_steps: 15
save_total_limit: 200
save_only_model: true
eval_strategy: "no"

output_dir: ${SCRATCH}/open-r1/cia/two_hop_qwen3_8b_rs_B_v3
overwrite_output_dir: true
push_to_hub: false
report_to:
  - wandb
wandb_project: cia-rs
wandb_run_name: two_hop-qwen3_8b-rs-B
