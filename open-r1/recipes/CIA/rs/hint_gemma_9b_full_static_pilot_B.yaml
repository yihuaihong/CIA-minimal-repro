# CIA Rejection Sampling — MMLU Hint (paper §5)
# See recipes/CIA/rs/two_hop.yaml for full pipeline notes.

model_name_or_path: ${SCRATCH}/transformers/gemma-2-9b-it
model_revision: main
torch_dtype: bfloat16
attn_implementation: sdpa

dataset_name: ${SCRATCH}/open-r1/datasets/Hint_MMLU_static_rs_B_gemma_9b_full
dataset_config: default
dataset_train_split: train
dataset_test_split: validation

max_seq_length: 2048
packing: false
dataset_text_field: text

learning_rate: 1.0e-06
lr_scheduler_type: cosine
warmup_ratio: 0.1
num_train_epochs: 1
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
bf16: true
optim: adamw_bnb_8bit

log_level: info
logging_first_step: true
logging_steps: 10
logging_strategy: steps
save_strategy: "no"   # full static run: only the final model is evaluated
save_steps: 100
save_total_limit: 2
save_only_model: true
eval_strategy: "no"

output_dir: ${SCRATCH}/open-r1/cia/hint_gemma_9b_full_static_rs_B_pilot
overwrite_output_dir: true
push_to_hub: false
report_to:
  - wandb
wandb_project: cia-rs
wandb_run_name: hint-gemma_9b-static-rs-B-full
