# CIA DPO — TwoHopFact (paper §5, top-3 vs bottom-3 pairing)
#
# Pipeline:
#   1. (shared with RS) python scripts/cia/generate_rollouts.py --task two_hop \
#         --output ${SCRATCH}/open-r1/rollouts/two_hop_<model>.jsonl
#   2. python scripts/cia/build_dpo_dataset.py \
#         --rollouts ${SCRATCH}/open-r1/rollouts/two_hop_<model>.jsonl \
#         --out_dir  ${SCRATCH}/open-r1/datasets/TwoHopFact_dpo_<model> \
#         --top_k 3
#   3. accelerate launch src/open_r1/dpo.py --config recipes/CIA/dpo/two_hop.yaml

model_name_or_path: ${SCRATCH}/transformers/Qwen3-8B
model_revision: main
torch_dtype: bfloat16
attn_implementation: sdpa

dataset_name: ${SCRATCH}/open-r1/datasets/TwoHopFact_dpo_v3_qwen3_8b
dataset_config: default
dataset_train_split: train
dataset_test_split: validation

# DPO hyperparameters (paper §E.1)
beta: 0.1
max_length: 2048
max_prompt_length: 1024
loss_type: sigmoid     # standard DPO loss

learning_rate: 5.0e-07
lr_scheduler_type: cosine
warmup_ratio: 0.1
num_train_epochs: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
bf16: true
optim: adamw_bnb_8bit

log_level: info
logging_first_step: true
logging_steps: 10
logging_strategy: steps
save_strategy: steps
save_steps: 15
save_total_limit: 200
save_only_model: true
eval_strategy: "no"

output_dir: ${SCRATCH}/open-r1/cia/two_hop_qwen3_8b_dpo_v3
overwrite_output_dir: true
push_to_hub: false
report_to:
  - wandb
wandb_project: cia-dpo
wandb_run_name: two_hop-qwen3_8b-dpo
